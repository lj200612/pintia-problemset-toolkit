name: 功能建议
description: 建议符合项目本地学习辅助边界的新功能。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        不接受交卷、删除、重判、调分、访问控制绕过、人机验证规避、作弊或管理端接口相关功能。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户需求，不要附真实题面、账号或课程信息。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明数据流、网络请求和安全边界是否变化。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 建议只面向用户有权访问的账号和内容。
          required: true
        - label: 建议不包含管理、绕过、作弊或高风险自动化能力。
          required: true

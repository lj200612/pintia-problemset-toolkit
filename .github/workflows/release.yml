name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match package version {expected!r}")
          PY
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6,<8"
          python -m build --sdist --wheel
          python -m twine check dist/*
      - name: Generate checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=".github/release-notes/$GITHUB_REF_NAME.md"
          if [[ -f "$notes_file" ]]; then
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
              exit 0
            fi
            gh release create "$GITHUB_REF_NAME" \
              dist/*.whl \
              dist/*.tar.gz \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          else
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
              exit 0
            fi
            gh release create "$GITHUB_REF_NAME" \
              dist/*.whl \
              dist/*.tar.gz \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

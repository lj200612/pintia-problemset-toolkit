name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify dependency lock
        run: |
          python -m pip install "uv==0.11.31"
          uv lock --check
      - name: Check tracked release content
        run: python scripts/check_release.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8.3,<10"
      - name: Compile Python sources
        run: python -m compileall -q pta pta_submit.py pta_fetch.py pta_list.py pta_web.py scripts
      - name: Run tests
        run: python -m pytest

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit base and optional browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.9,<3"
          python -m pip_audit -r requirements-browser.txt --strict

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install locked development environment
        run: |
          python -m pip install "uv==0.11.31"
          uv sync --locked --all-extras
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Lint Python sources
        run: uv run ruff check .
      - name: Type-check Python sources
        run: uv run python -m mypy
      - name: Check browser JavaScript syntax
        run: |
          node --check pta/web/app.js
          node --check pta/web/theme-init.js

  package:
    runs-on: ubuntu-latest
    needs: [release-boundary, test, quality, dependency-audit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          python -m build
          python -m twine check dist/*
      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          pta-submit --help
          pta-fetch --help
          pta-list --help
          pta-web --help
          python -c "from importlib.resources import files; assert files('pta').joinpath('web', 'index.html').is_file()"
          python - <<'PY'
          from pta.webapp import create_app

          app = create_app("smoke-config.json")
          app.config["TESTING"] = True
          client = app.test_client()
          token = app.config["PTA_API_TOKEN"]
          assert client.get("/").status_code == 200
          assert client.get("/api/status").status_code == 401
          assert client.get(
              "/api/status", headers={"Authorization": f"Bearer {token}"}
          ).status_code == 200
          PY

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pta-local-tool"
version = "0.1.0"
description = "Local CLI and WebUI helpers for authorized PTA/Pintia problem-set workflows"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
keywords = ["pta", "pintia", "education", "cli", "local-webui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Flask",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.33.0,<3.0.0",
  "Flask>=3.1.3,<4.0.0",
]

[project.urls]
Homepage = "https://github.com/lj200612/pintia-problemset-toolkit"
Repository = "https://github.com/lj200612/pintia-problemset-toolkit"
Issues = "https://github.com/lj200612/pintia-problemset-toolkit/issues"

[project.optional-dependencies]
browser = [
  "playwright>=1.61.0,<2.0.0",
]
dev = [
  "build>=1.2.2,<2.0.0",
  "mypy>=2.3.0,<3.0.0",
  "pip-audit>=2.9.0,<3.0.0",
  "pytest>=8.3.0,<10.0.0",
  "ruff>=0.16.0,<0.17.0",
  "twine>=6.1.0,<8.0.0",
  "types-requests>=2.32.4,<3.0.0",
]

[project.scripts]
pta-submit = "pta_submit:main"
pta-fetch = "pta_fetch:main"
pta-list = "pta_list:main"
pta-web = "pta_web:main"

[tool.setuptools]
include-package-data = true
py-modules = ["pta_submit", "pta_fetch", "pta_list", "pta_web"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pta*"]

# Web assets live beside the Python backend so source and wheel installs use
# the same import-relative layout.
[tool.setuptools.package-data]
pta = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
files = [
  "pta",
  "pta_fetch.py",
  "pta_list.py",
  "pta_submit.py",
  "pta_web.py",
  "scripts",
]
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
